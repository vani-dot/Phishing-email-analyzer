<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Set a new password — Phishing Email Analyzer</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      Set a new password
    </div>
    <p class="auth-sub">Your account requires a password change before you continue.</p>

    <div class="alert alert-error" id="error" hidden></div>

    <form id="change-form">
      <div class="field">
        <label for="current">Current password</label>
        <input type="password" id="current" required autocomplete="current-password" maxlength="256" autofocus>
      </div>
      <div class="field">
        <label for="next">New password</label>
        <input type="password" id="next" required autocomplete="new-password" maxlength="256">
        <p class="hint">At least 12 characters, mixing three of: lowercase, uppercase, digits, symbols.</p>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" required autocomplete="new-password" maxlength="256">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit">Set password</button>
    </form>
    <p class="hint hint-spaced">Changing your password signs out every other session.</p>
  </div>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/change_password.js"></script>
</body>
</html>
