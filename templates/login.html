<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign in — Phishing Email Analyzer</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      Phishing Email Analyzer
    </div>
    <p class="auth-sub">Sign in to analyse messages.</p>

    <div class="alert alert-error" id="error" hidden></div>
    <div class="alert alert-info" id="notice" hidden></div>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus
               autocomplete="username" maxlength="64" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password" maxlength="256">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit">Sign in</button>
    </form>
  </div>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
